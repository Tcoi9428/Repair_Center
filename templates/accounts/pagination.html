<div class="table-footer"><span>Всего: {{ page_obj.paginator.count }}</span><nav class="pagination" aria-label="Страницы">{% if page_obj.has_previous %}<a href="?page={{ page_obj.previous_page_number }}&status={{ status|urlencode }}&q={{ q|urlencode }}">← Назад</a>{% endif %}<span>{{ page_obj.number }} / {{ page_obj.paginator.num_pages }}</span>{% if page_obj.has_next %}<a href="?page={{ page_obj.next_page_number }}&status={{ status|urlencode }}&q={{ q|urlencode }}">Далее →</a>{% endif %}</nav></div>
