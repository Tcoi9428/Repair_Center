<div class="table-scroll"><table><thead><tr><th>Номенклатурный номер</th><th>Наименование</th><th>Количество</th><th>Примечание</th></tr></thead><tbody>{% for line in lines %}<tr><td class="code-cell">{{ line.material.nomenclature_number|default:'—' }}</td><td>{{ line.material.name }}</td><td class="code-cell">{{ line.quantity|default:'—' }} {{ line.unit }}</td><td>{{ line.notes|default:'—' }}</td></tr>{% empty %}<tr><td colspan="4">Не указаны.</td></tr>{% endfor %}</tbody></table></div>
